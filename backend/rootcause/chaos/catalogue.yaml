# Chaos catalogue: flag -> ground truth. Used ONLY by the chaos harness for scoring, never by the engine.
# Variants verified against demo src/flagd/demo.flagd.json (demo commit df9f4d0, 15 Oct 2026). VERIFY every and every `truth` by breaking the flag once by hand (CLAUDE.md §12),
# then write what you observed (which alerts, which nodes) in the comments. A human confirms each entry.
# `off` is the variant the harness restores between runs (VERIFY it exists for every flag).

- {flag: paymentFailure, variant: "100%", off: "off", truth: payment, class: errors}
- {flag: paymentUnreachable, variant: "on", off: "off", truth: "edge:checkout->payment", class: errors}
- {flag: cartFailure, variant: "100%", off: "off", truth: cart, class: errors}
- {flag: adFailure, variant: "on", off: "off", truth: ad, class: errors}
- {flag: productCatalogFailure, variant: "on", off: "off", truth: product-catalog, class: errors}
- {flag: productCatalogLockContention, variant: "on", off: "off", truth: product-catalog, class: latency}   # product-catalog's own loop takes an ACCESS EXCLUSIVE lock on catalog tables (product-catalog/main.go triggerLockContention); the slow DB calls are a symptom
- {flag: imageSlowLoad, variant: "5sec", off: "off", truth: frontend-proxy, class: latency}   # truth from demo source (decided before the sweep): the browser sends `x-envoy-fault-delay-request` (frontend/components/ProductCard.tsx) and Envoy in frontend-proxy injects the delay; image-provider itself is not slow
- {flag: intlShippingSlowdown, variant: "5sec", off: "off", truth: shipping, class: latency}
- {flag: adHighCpu, variant: "on", off: "off", truth: ad, class: invisible}
- {flag: adManualGc, variant: "on", off: "off", truth: ad, class: latency}
- {flag: emailMemoryLeak, variant: "100x", off: "off", truth: email, class: invisible}
- {flag: recommendationCacheFailure, variant: "on", off: "off", truth: recommendation, class: invisible}
- {flag: kafkaQueueProblems, variant: "3sec", off: "off", truth: [fraud-detection, checkout], class: invisible}   # two effects in the demo source: checkout floods `orders` with N extra copies per order (checkout/main.go) and fraud-detection sleeps N ms per record (fraud-detection/main.kt); either is a correct root (decided from source before re-running)
- {flag: kafkaConsumerDead, variant: "on", off: "off", truth: fraud-detection, class: invisible}   # docs: "removes fraud detection from the orders consumer group"
- {flag: aiRunawayAgent, variant: "on", off: "off", truth: agent, class: ai}   # flag name confirmed in OTel docs; VERIFY it changes behaviour with USE_VCR=True
- {flag: aiSlowResponse, variant: "5sec", off: "off", truth: agent, class: ai}   # flag name confirmed in OTel docs; VERIFY it changes behaviour with USE_VCR=True
