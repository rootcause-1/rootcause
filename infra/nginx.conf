server {
  listen 8088;
  root /usr/share/nginx/html;

  location /api/stream {
    proxy_pass http://rootcause-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://rootcause-api:8000;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";   # hashed assets change on every build; never serve a stale entry page
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
