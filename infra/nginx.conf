server {
  listen 8088;
  root /usr/share/nginx/html;

  location /api/stream {
    proxy_pass http://rootcause-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://rootcause-api:8000;
  }
  location / {
    try_files $uri /index.html;
  }
}
