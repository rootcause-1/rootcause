# Public deployment: FalkorDB + API in replay mode + UI behind one port (8088). No OpenTelemetry Demo needed.
# Fresh VM: `docker compose -f infra/docker-compose.replay.yml up -d --build` -> http://<host>:8088
name: rootcause-replay

services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    restart: unless-stopped

  rootcause-api:
    build: {context: .., dockerfile: infra/Dockerfile.api}
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      RC_MODE: replay
      RC_GRAPH: rc_replay
      RC_AGENT_MODE: autopilot
      RC_REPLAY_SCENARIO: ${RC_REPLAY_SCENARIO:-productCatalogLockContention}   # 12 alarms, 3 teams, 1 cause
      RC_CODE_REPO: ${RC_CODE_REPO:-https://github.com/open-telemetry/opentelemetry-demo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}               # fix PRs, only on RC_PR_REPO (our fork)
      RC_PR_REPO: ${RC_PR_REPO:-}
    restart: unless-stopped
    depends_on: [falkordb]

  rootcause-ui:
    build: {context: .., dockerfile: infra/Dockerfile.ui}
    ports: ["${RC_PUBLIC_PORT:-8088}:8088"]   # the AWS demo host sets RC_PUBLIC_PORT=80
    restart: unless-stopped
    depends_on: [rootcause-api]
