# RootCause runtime configuration.
# Anything marked VERIFY must be checked against the running OpenTelemetry Demo (CLAUDE.md §5)
# and the real value written here. `null` means "not verified yet" — the code skips that input
# and logs a warning instead of guessing.

demo:
  compose_project: opentelemetry-demo        # verified 2026-10-15: compose project label + `docker network ls`
  network: opentelemetry-demo                # verified
  collector_exporter_type: otlp_http         # verified: collector-contrib 0.160.0 accepts otlp_http/<name>
  collector_json_encoding: true              # verified: `encoding: json` accepted; bodies arrive gzip-compressed
  agent_prompt_url: http://agent:8010/prompt # verified (compose.agent.yaml, AGENT_PORT=8010); body {message: ...}; the load generator already sends prompts (user_ask_agent)
  agent_service: agent                       # verified: service.name of the agent's spans
  agent_workflow_span: astronomy_shop_agent_workflow   # verified: real span name is astronomy_shop_agent_workflow.workflow (prefix match)
  flagd_hot_reload: null                     # VERIFY: true once a hand edit changes the shop
  flag_eval_attribute: feature_flag.key      # verified: `feature_flag.evaluation` span events carry feature_flag.key (cart, checkout, product-catalog, recommendation, agent)

ingest:
  window_seconds: 60
  finalise_lag_ticks: 2                      # traces younger than this many ticks are not aggregated yet
  journey_root_services: [frontend-proxy, frontend, agent]   # agent: the load generator calls POST /prompt directly
  journey_critical_share: 0.9                # REQUIRES.critical when a service is in >= 90% of a journey's traces
  # map rpc.service / server.address values to service.name when no server span answers
  peer_aliases:
    oteldemo.PaymentService: payment
    oteldemo.CartService: cart
    oteldemo.CheckoutService: checkout
    oteldemo.CurrencyService: currency
    oteldemo.EmailService: email
    oteldemo.ProductCatalogService: product-catalog
    oteldemo.RecommendationService: recommendation
    oteldemo.ShippingService: shipping
    oteldemo.AdService: ad
    oteldemo.QuoteService: quote
  cache_systems: [redis, valkey]

prometheus:
  url: http://prometheus:9090                # verified: prometheus:9090 inside the demo network (overridden by PROMETHEUS_URL)
  # Filled by scripts/discover_metrics.py, then confirmed by a human. Each entry:
  #   promql: the query; label: which series label names the target; target_prefix: node id prefix;
  #   prop: the property written on the node.
  queries:
    # verified 2026-10-15 via scripts/discover_metrics.py (kafkametrics receiver; series per group+topic, e.g. orders)
    kafka_lag: {promql: 'sum by (topic) (kafka_consumer_group_lag_sum_ratio)', label: topic, target_prefix: 'queue:', prop: lag}
    # verified: JVM services only (ad, recommendation, fraud-detection, kafka); others are covered by docker stats
    runtime_memory: {promql: 'sum by (service_name) (jvm_memory_used_bytes)', label: service_name, target_prefix: '', prop: runtime_mem_mb, scale: 1.0e-6}
    # verified: fraction of wall time a JVM spent in GC over 2 min (ad ~0 healthy, ~0.30 under adManualGc)
    gc_time: {promql: 'sum by (service_name) (increase(jvm_gc_duration_seconds_sum[2m])) / 120', label: service_name, target_prefix: '', prop: gc_frac}

docker:
  enabled: true
  stats_parallelism: 8
  mem_slope_window_s: 120

flagd:
  poll_seconds: 2
  path: null                                 # VERIFY (overridden by FLAGD_CONFIG_PATH)

detect:
  learn_seconds: 180
  ewma_alpha: 0.1                            # while learning (first learn_seconds)
  ewma_alpha_live: 0.01                      # afterwards: half-life ~6 min, so slow faults are not absorbed as normal
  hold_ticks: 2                              # a rule must hold this many consecutive ticks
  hold_ticks_by_kind: {memory: 12, lag: 6, cpu: 6}   # memory 60 s on top of the 2-min slope window (= 2 min of growth), lag 30 s, cpu 30 s; 5 s ticks
  resolve_ticks: 3                           # healthy ticks before an alert resolves
  no_data_resolve_ticks: 24                  # a window too quiet to judge holds alert state; 2 min of silence counts as healthy
  min_rps: 0.02                              # ignore error/latency rules on nodes with less traffic (real demo: checkout/payment run at ~0.03 rps)
  error_sigma: 3.0
  error_floor: 0.05
  error_min_count: 2                         # at least 2 failed requests in the window
  latency_factor: 2.0
  latency_sigma: 3.0                         # and above baseline + 3 x its mean deviation
  latency_min_ms: 100                        # a p95 under 100 ms is not a user-visible latency incident
  lag_consume_ratio: 0.2
  lag_min_messages: 3                        # a lag of 1-2 orders is one message in flight, not a backlog
  latency_min_samples: 10                    # a p95 of fewer requests is just their max (agent: ~9 spiky VCR runs/min)
  mem_slope_mb_per_min: 5
  mem_sigma: 3.0                             # and above baseline slope + 3 x its mean deviation
  cpu_pct: 85
  gc_min_frac: 0.05                          # >5 % of wall time in GC, and above baseline + 3 x deviation
  agent_loop_factor: 3.0
  llm_latency_factor: 2.0
  llm_latency_min_ms: 1000                   # an LLM reply under 1 s is never an incident (VCR replays answer in ~20 ms)

engine:
  agent_delay_seconds: 15                    # let an incident gather alerts before investigating
  recover_ticks: 3                           # incident auto-resolves after this many ticks with no anomalous members
  weights:
    depth: 0.30
    self: 0.25
    pagerank: 0.20
    change: 0.15
    memory: 0.10
  change_strong_min: 10
  change_weak_min: 30
  strong_memory: 0.6
  evidence_max_hops: 8

safety:
  stateful_datastores: [cache:valkey-cart]
  high_betweenness_percentile: 0.8

agent:
  max_tool_calls: 12
  budget_seconds: 90

verify:
  timeout_seconds: 90

chaos:
  settle_seconds: 45                         # after the first verdict, wait for re-investigations before scoring

# never candidates for root cause, never alerted on
non_candidates: [load-generator, frontend-web, flagd, flagd-ui, otel-collector, otelcol, rootcause-api, rootcause-mcp, rootcause-ui, jaeger, prometheus, grafana, opensearch]
